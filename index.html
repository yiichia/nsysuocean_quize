<!--
  ============================================================
  v4.1：fun fact 全數換成校方提供的版本（v4.0 為換皮不換骨的大改版）

  12 道題、計分邏輯、進化版機制全部沒動。
  換掉的只有「代表生物」——因為那 10 個位子測的是個性軸，不是生物本身。

  ── 這一版的核心決定 ──────────────────────────────
  基本型 11 種 → 全部換成台灣潮間帶／礁岩的在地物種。
  稀有型（隱藏版＋進化版）→ 保留鯨鯊、虎鯨、鬼蝠魟這些有明星相的。
  理由：基本型負責講「這是你腳邊的海」，稀有型負責讓人想截圖分享。
       兩件事都要，但不必由同一隻生物來做。

  ── 位子與生物對照 ────────────────────────────────
  好奇敢闖   浪頭探路者     白紋方蟹
  溫柔堅定   海洋守護者     海葵
  細膩耐心   造管工匠       纓鰓蟲（羽毛管蟲）
  帶隊策略   洋流領航者     烏魚
  安靜觀察   潮間帶觀察家   彈塗魚
  感性創作   變色創作者     花枝（烏賊）
  不從眾     特立獨行者     海蛞蝓          ← 保留
  內斂專情   低調專情者     笠螺
  利他可靠   熱心服務者     清潔蝦          ← 保留
  韌性恢復   百折不撓者     陽燧足          ← 保留
  分工協作   一個人的艦隊   僧帽水母        ← v3.2 新增
  ── 隱藏 ──
  什麼都沾  難以定義者      章魚
  在地限定  唯一原生種      柴山多杯孔珊瑚（三選項解鎖，見 CHAI_KEY）
  ── 進化版（獎勵層，不必在地）──
  椰子蟹／鯨鯊／隆頭鸚哥魚／虎鯨／螳螂蝦／鬼蝠魟／
  西班牙舞者／鱟／裂唇魚／燈塔水母

  ── fun fact 改短 ─────────────────────────────────
  原本的生物介紹是一整段，這版一律壓到 1–2 句。
  標準：講完會想唸給旁邊的人聽。做不到就代表那句還不夠短或不夠奇。

  字型維持系統內建，全站零外部連線。
  ============================================================

<style>

  chai:{name:"柴山多杯孔珊瑚 Polycyathus chaishanensis",title:"唯一原生種",sub:"扎根 · 低調 · 無可取代",
    rarity:"🪸 在地限定 · 全世界第一隻，就在中山大門口",
    trait:"你不長在漂亮的地方。浪最大、水最濁、別人待不住的環境，你反而扎得下根。你不搶眼，也很少解釋自己，但你待著的地方，會慢慢變成別人離不開的地方。你不是因為特別才稀有——你是因為只有一個，才稀有。",
    fact:"高雄在地限定的驕傲。2012 年，這種台灣特有的石珊瑚就是在中山大門口那片礁岩被發表的，學名直接叫「柴山」。牠不造礁、數量極少，是一級保育類。",
    share:"我解到了在地限定版 🪸 全世界第一隻柴山多杯孔珊瑚，就是在中山大門口被發現的。你解得到嗎？",

function ratios(){
  const r = {};
  TYPES.forEach(t => r[t] = MAXP[t] ? scores[t] / MAXP[t] : 0);

}
function baseWinner(r){
  const top = Math.max(...TYPES.map(t => r[t]));
  const tied = TYPES.filter(t => r[t] === top);
  if(tied.length === 1) return tied[0];
  for(let i = picks.length - 1; i >= 0; i--){
    if(tied.indexOf(picks[i]) !== -1) return picks[i];
  }
  return tied[0];

   return CHAI_KEY.filter(([q,o]) => chosen[q] === o).length >= 2; */
function chaiUnlocked(){ return CHAI_KEY.every(([q,o]) => chosen[q] === o); }

function winner(){
  if(chaiUnlocked()) return 'chai';
  const r = ratios();
  const top = Math.max(...TYPES.map(t => r[t]));

  const b = baseWinner(r);
  let second = -1;
  TYPES.forEach(t => { if(t !== b && r[t] > second) second = r[t]; });

  const stale = pool.filter(f => seenFacts.has(f.i));
  const shuffle = arr => arr.map(v => [Math.random(), v]).sort((a,b) => a[0]-b[0]).map(v => v[1]);
  let out = shuffle(fresh).slice(0, 3);
  if(out.length < 3) out = out.concat(shuffle(stale).slice(0, 3 - out.length));
  if(rare && !out.some(f => f.rare)){
    const rareFresh = shuffle(pool.filter(f => f.rare && !seenFacts.has(f.i)));
    const pk = rareFresh[0] || shuffle(pool.filter(f => f.rare))[0];
    if(pk && !out.some(f => f.i === pk.i)) out[out.length - 1] = pk;
  }
  out.forEach(f => seenFacts.add(f.i));
  return out;
}

function factsHTML(resultKey){
  const list = drawFacts(resultKey);
  const total = FACTS.length;
  const rareCount = FACTS.filter(f => f.rare).length;
  const got = seenFacts.size;
  const pct = Math.round(got / total * 100);
  const allRareSeen = FACTS.every((f, i) => !f.rare || seenFacts.has(i));
  let nudge;
  if(got >= total) nudge = `你把 ${total} 則全看完了。你現在比很多中山學生還懂這所學校。`;
  else if(!allRareSeen) nudge = `有 ${rareCount} 則，只有解鎖隱藏版或進化版才看得到。再玩一次試試？`;
  else nudge = '再玩一次，會看到不一樣的 3 則。';
  return `
    <div class="facts">
      <h3>中山冷知識</h3>
      <ul>${list.map(f => `
        <li class="${f.rare ? 'frare' : ''}"><span class="ftag">${f.tag}</span><p>${f.text}</p></li>`).join('')}
      </ul>
      <div class="fbar"><div class="track"><i style="width:${pct}%"></i></div><span>已解鎖 ${got}／${total}</span></div>
      <p class="fnudge">${nudge}</p>
    </div>`;
}

function ctaHTML(){
  const btn = (url, cls, label, fallback) => url
    ? `<a class="btn ${cls}" href="${url}" target="_blank" rel="noopener">${label}</a>`
    : `<button class="btn ${cls}" onclick="alert('${fallback}')">${label}</button>`;
  return `
    ${btn(LINK_EXPLORE, '', '看看中山有什麼 →', '請在程式最上方填入 LINK_EXPLORE。')}
    ${btn(LINK_EVENT, 'sea', '來現場走一趟：營隊與參訪 →', '請在程式最上方填入 LINK_EVENT。')}
    ${btn(LINK_FOLLOW, 'ghost', '追蹤中山，看學長姐的日常 →', '請在程式最上方填入 LINK_FOLLOW。')}
    <p class="hint">不用急著決定什麼，先認識就好。</p>`;
}

function renderResult(){
  const key = winner();
  const a = A[key];
  const behaviors = BEHAVIORS[baseKey(key)] || [];
  card.innerHTML = `
    <p class="rarity">✦ ${a.rarity}</p>
    <p class="rname">旅程的盡頭，你是——</p>
    <h2 class="rtitle">${a.title}</h2>
    <p class="rsub">${a.name}　·　${a.sub}</p>
    <div class="creature"><div class="disc">${a.svg}</div></div>

    <div class="block"><h3>關於你</h3><p>${a.trait}</p></div>

    <div class="fun"><h3>💡 關於這隻生物</h3><p>${a.fact}</p></div>
    ${a.alert ? `<div class="alert"><p>⚠ ${a.alert}</p></div>` : ''}

    <div class="campus">
      <h3>你是不是⋯⋯</h3>
      <ul>${behaviors.map(b => `<li>${b}</li>`).join('')}</ul>
    </div>

    ${factsHTML(key)}

    <div class="block"><h3>這個測驗，你該傳給誰</h3>
      <div class="pair"><span><b>一拍即合</b>${a.mate}</span><span><b>互補搭檔</b>${a.duo}</span></div></div>

    <div class="share"><p>「${a.share}」</p>
      <div class="row"><button class="btn sea" onclick="copyText('${key}',this)">複製分享文案</button></div>
      <small>把測驗傳給你的海洋麻吉，看看你們配不配 👀</small></div>

    <div class="actions">
      ${ctaHTML()}
      <button class="btn ghost" onclick="begin()">我還想再玩一次</button>
    </div>

    <p class="disclaim">這是一份為了好玩做的測驗，不是性向鑑定。<br>真正的你，比 12 題複雜得多。</p>
    <p class="note">＊三顆按鈕之後可接上實際連結 / QR code，建議各自加 UTM 參數</p>`;
  window.scrollTo({top:0, behavior:'smooth'});
}

function shareText(key){
  const tail = SITE_URL ? `\n中山大學 · 海洋性向測驗 ${SITE_URL}` : `\n—— 中山大學 · 海洋性向測驗`;
  return A[key].share + tail;
}
function copyText(key, btn){
  const text = shareText(key);
  const done = () => { btn.textContent = '已複製 ✓'; setTimeout(() => btn.textContent = '複製分享文案', 1600); };
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly','');
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch(e) { btn.textContent = '複製失敗，請手動選取'; }
    document.body.removeChild(ta);
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  } else fallback();
}

resetScores();
start();
</script>
